stages:
  preprocess_data:
    cmd: python src\prepare.py
    deps:
    - data\raw
    - src\preprocess.py
    params:
    - data.augment
    - data.image_size
    - data.seed
    outs:
    - data\processed
  
  train_eval:
    cmd: python src\train_eval.py
    deps:
    - data\processed
    - src\train_eval.py
    - src\extract_color_texture.py
    - src\extract_HOG.py
    params:
    - train.model_name
    metrics:
    - metrics.json:
        cache: false
    
