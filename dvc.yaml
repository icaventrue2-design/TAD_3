stages:
  preprocess_data:
    cmd: python src\prepare.py
    deps:
    - data\raw
    - src\prepare.py
    params:
    - data.augment
    - data.image_size
    - data.seed
    outs:
    - data\processed
  
  extract_features:
    cmd: python src/extract_keras_features.py
    deps:
      - src/extract_keras_features.py
      - ${data.resnet_weights_path} # DVC берет путь напрямую из params.yaml
      - data/processed/images_train
      - data/processed/images_test
      - data/processed/train_processed.csv
      - data/processed/test_processed.csv
    params:
      - data.resnet_weights_path
    outs:
      - data/features/X_train_resnet.npy
      - data/features/y_train_resnet.npy
      - data/features/X_test_resnet.npy
      - data/features/y_test_resnet.npy

  train_eval:
    cmd: python src\train_eval.py
    deps:
    - src\train_eval.py
    - data/features/X_train_resnet.npy
    - data/features/y_train_resnet.npy
    - data/features/X_test_resnet.npy
    - data/features/y_test_resnet.npy
    params:
    - train.model_name
    metrics:
    - metrics.json:
        cache: false
    
